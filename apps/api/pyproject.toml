[project]
name = "aware-care-api"
version = "0.1.0"
description = "Aware Care application API (development build; synthetic mock mode by default)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "jsonschema==4.25.1",  # validates the local model's draft (app/modules/guidance/local.py, #51)
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../../tests/acceptance"]
pythonpath = ["."]
