# Aware Care web gateway (infra/deploy/web.Dockerfile). Runs as the unprivileged
# nginx user with a read-only root filesystem; every writable path is under /tmp.
# njs signs presenter assertions (presenter-api.conf.template, #487); loaded even when the presenter path is off.
load_module modules/ngx_http_js_module.so;
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Request logs are off: operational events stay content-free (R36).
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /tmp/*.conf;
}
