# #487: the presenter API when presenter access is off (no key, not enabled, or a non-loopback bind). Copied to
# /tmp/aware-care/presenter-api.conf by 25-aware-care-presenter.sh. The path answers like the API refuses a presenter
# request (403 PRESENTER_REQUIRED, the API's error shape) and never reaches the API, so a presenter page can never
# create a patient session by mistake and never receives the app shell (index.html) as an API answer. No
# X-AwareCare-Gateway hint: the presenter gate then says that presenter access is not available here.
    location /presenter-api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 403 '{"code":"PRESENTER_REQUIRED","message":"Presenter access is not enabled on this device.","field_errors":[],"retryable":false}';
    }
