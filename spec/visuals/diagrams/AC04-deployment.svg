3EB"/><rect x="420" y="584" width="235" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="438" y="619" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Runtime</text><text x="438" y="645" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">adapter</text><text x="438" y="673" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Pinned local model</text><text x="438" y="696" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">No cloud fallback</text><rect x="687" y="584" width="235" height="123" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="687" y="584" width="235" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="705" y="619" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Local data</text><text x="705" y="645" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">stores</text><text x="705" y="673" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Case DB, records,</text><text x="705" y="696" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">corpus + indexes</text><rect x="954" y="584" width="236" height="123" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="954" y="584" width="236" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="972" y="619" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Retrieval</text><text x="972" y="645" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">gateway</text><text x="972" y="673" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Allowlisted requests</text><text x="972" y="696" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Validated responses</text><polyline points="538,523 538,584" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="538,584 533.6503446588877,574.9955289764732 542.3496553411123,574.995528976