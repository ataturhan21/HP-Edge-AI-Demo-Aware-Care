Sans" font-size="21" font-weight="400" fill="#526B7B">database.</text><text x="56" y="588.2" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B"></text><text x="56" y="617.6" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">A clinic-based host can</text><text x="56" y="647.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">become a healthcare</text><text x="56" y="676.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">edge deployment.</text><text x="1280" y="300.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Only approved egress</text><text x="1280" y="329.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">crosses the host</text><text x="1280" y="358.8" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">boundary.</text><text x="1280" y="388.2" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B"></text><text x="1280" y="417.6" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">No raw symptoms,</text><text x="1280" y="447.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">records, names or case</text><text x="1280" y="476.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">IDs in lookups.</text></svg>