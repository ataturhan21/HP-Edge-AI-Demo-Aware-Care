<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">AWARE CARE</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">8 value hypotheses. Evidence before claims.</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Benefits span patients, clinical teams, payers and technology leaders. Savings are not measured by demo clicks.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Source: PMD v2.0 pp. 2-4, 35 | Benefits are hypotheses, not proven outcomes</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">02</text><rect x="56" y="218" width="354" height="245" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="218" width="7" height="245" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="78" y="250" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">B01 | PATIENTS</text><text x="78" y="287" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Better care</text><text x="78" y="317" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">destination</text><text x="78" y="359.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Specialty and preference</text><text x="78" y="384.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">matching.</text><text x="78" y="409.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Measure appropriate first</text><text x="78" y="434.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">destination.</text><rect x="434" y="218" width="354" height="245" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="434" y="218" width="7" height="245" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="456" y="250" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">B02 | CLINICIANS</text><text x="456" y="287" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Less avoidable</text><text x="456" y="317" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">demand</text><text x="456" y="359.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Reviewed guidance for suitable</text><text x="456" y="384.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">concerns.</text><text x="456" y="409.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Measure avoidable visits AND</text><text x="456" y="434.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">delays.</text><rect x="812" y="218" width="354" height="245" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="812" y="218" width="7" height="245" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="834" y="250" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">B03 | CLINICAL STAFF</text><text x="834" y="287" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Less repeated intake</text><text x="834" y="329.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Confirmed history and useful</text><text x="834" y="354.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">summaries.</text><text x="834" y="379.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Measure net time including</text><text x="834" y="404.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">corrections.</text><rect x="1190" y="218" width="354" height="245" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1190" y="218" width="7" height="245" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="1212" y="250" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">B04 | HEALTH SYSTEMS</text><text x="1212" y="287" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">More useful capacity</text><text x="1212" y="329.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Reduce misdirected</text><text x="1212" y="354.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">appointments.</text><text x="1212" y="379.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Measure wait times and filled</text><text x="1212" y="404.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">slots.</text><rect x="56" y="488" width="354" height="245" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="488" width="7" height="245" rx="3" fill="#008779" stroke="#008779"/><text x="78" y="520" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">B05 | PAYERS</text><text x="78" y="557" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Lower avoidable</text><text x="78" y="587" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">spending</text><text x="78" y="629.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">More appropriate episode</text><text x="78" y="654.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">utilization.</text><text x="78" y="679.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Measure adjusted total allowed</text><text x="78" y="704.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">cost.</text><rect x="434" y="488" width="354" height="245" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="434" y="488" width="7" height="245" rx="3" fill="#008779" stroke="#008779"/><text x="456" y="520" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">B06 | CAREGIVERS</text><text x="456" y="557" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Less navigation</text><text x="456" y="587" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">effort</text><text x="456" y="629.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Clear next steps and visit options.</text><text x="456" y="654.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Measure time, cost and</text><text x="456" y="679.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">comprehension.</text><rect x="812" y="488" width="354" height="245" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="812" y="488" width="7" height="245" rx="3" fill="#008779" stroke="#008779"/><text x="834" y="520" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">B07 | CIO / PRIVACY</text><text x="834" y="557" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">More data control</text><text x="834" y="599.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Local inference and lifecycle</text><text x="834" y="624.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">controls.</text><text x="834" y="649.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Verify egress, access and</text><text x="834" y="674.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">deletion.</text><rect x="1190" y="488" width="354" height="245" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1190" y="488" width="7" height="245" rx="3" fill="#008779" stroke="#008779"/><text x="1212" y="520" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">B08 | CTO / OPERATIONS</text><text x="1212" y="557" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Observable AI</text><text x="1212" y="587" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">delivery</text><text x="1212" y="629.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Versioned models and repeatable</text><text x="1212" y="654.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">builds.</text><text x="1212" y="679.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">Measure recovery and cost per</text><text x="1212" y="704.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">run.</text><rect x="56" y="787" width="1488" height="100" rx="16" fill="#142F40" stroke="#142F40"/><text x="80" y="822" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#FFFFFF">Economic discipline</text><text x="80" y="855.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#FFFFFF">Freed capacity is not automatically cash savings. Provider revenue effects and payer savings must be evaluated separately.</text></svg>