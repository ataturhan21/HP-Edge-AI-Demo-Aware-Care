<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">AWARE CARE</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Eligibility first. Explained ranking second.</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">M09 uses structured directory facts. The LLM neither invents providers nor determines their ranking.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Source: PMD v2.0 pp. 21, 31 | Requirements R28-R31 | No automatic booking</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">09</text><rect x="56" y="236" width="334" height="161" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="236" width="334" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="74" y="271" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">1. Current guidance</text><text x="74" y="299" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Non-urgent care setting and</text><text x="74" y="322" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">reviewed specialty</text><text x="74" y="345" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">recommendation</text><rect x="430" y="236" width="334" height="161" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="430" y="236" width="334" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="448" y="271" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">2. Hard constraints</text><text x="448" y="299" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Specialty, visit type, radius or</text><text x="448" y="322" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">telehealth jurisdiction; required</text><text x="448" y="345" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">plan/language</text><rect x="804" y="236" width="334" height="161" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="804" y="236" width="334" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="822" y="271" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">3. Deterministic rank</text><text x="822" y="299" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Relevance, optional preferences,</text><text x="822" y="322" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">freshness, distance, stable ID</text><rect x="1178" y="236" width="366" height="161" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1178" y="236" width="366" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="1196" y="271" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">4. Explain matches</text><text x="1196" y="299" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Confirmed matches, unknowns,</text><text x="1196" y="322" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">source dates and contact link</text><polyline points="390,317 430,317" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="430,317 420.9955289764732,321.3496553411123 420.9955289764732,312.6503446588877" fill="#087BA8"/><polyline points="764,317 804,317" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="804,317 794.9955289764732,321.3496553411123 794.9955289764732,312.6503446588877" fill="#087BA8"/><polyline points="1138,317 1178,317" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="1178,317 1168.9955289764732,321.3496553411123 1168.9955289764732,312.6503446588877" fill="#087BA8"/><rect x="56" y="449" width="716" height="206" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="449" width="7" height="206" rx="3" fill="#BF5938" stroke="#BF5938"/><text x="78" y="481" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#BF5938">REQUIRED CRITERIA</text><text x="78" y="518" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Unknown does not qualify</text><text x="78" y="560.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">An unverified required insurance plan or language excludes the</text><text x="78" y="588.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">record. Insurance acceptance is not proof of participation in the</text><text x="78" y="616.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">exact plan.</text><rect x="796" y="449" width="748" height="206" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="796" y="449" width="7" height="206" rx="3" fill="#008779" stroke="#008779"/><text x="818" y="481" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">ZERO RESULTS</text><text x="818" y="518" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Ask before relaxing a filter</text><text x="818" y="560.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Explain the exclusion. Propose 1 explicit change. Rerun only after the</text><text x="818" y="588.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">user accepts. Never silently broaden eligibility.</text><rect x="56" y="724" width="1488" height="100" rx="16" fill="#142F40" stroke="#142F40"/><text x="80" y="759" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#FFFFFF">Contact is a deliberate handoff</text><text x="80" y="792.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#FFFFFF">Use approved HTTPS links without consultation payload. Availability, credential status and exact plan participation need separate verification.</text></svg>