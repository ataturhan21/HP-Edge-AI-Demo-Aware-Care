<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">AWARE CARE</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Generation is a guarded transaction</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Immutable reviewed snapshot; no model tools or internet. Initial capacity: 1 active generation job + queue of 3.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Source: PMD v2.0 pp. 23, 29-30, 34 | All operations shown are proposed</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">06</text><rect x="56" y="213" width="204" height="62" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="213" width="204" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="74" y="248" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Browser</text><polyline points="158,278 158,791" fill="none" stroke="#D6E3EB" stroke-width="2" stroke-dasharray="6 5"/><rect x="371" y="213" width="204" height="62" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="371" y="213" width="204" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="389" y="248" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Guidance M08</text><polyline points="473,278 473,791" fill="none" stroke="#D6E3EB" stroke-width="2" stroke-dasharray="6 5"/><rect x="686" y="213" width="204" height="62" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="686" y="213" width="204" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="704" y="248" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Evidence M07</text><polyline points="788,278 788,791" fill="none" stroke="#D6E3EB" stroke-width="2" stroke-dasharray="6 5"/><rect x="1001" y="213" width="204" height="62" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1001" y="213" width="204" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="1019" y="248" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Local runtime</text><polyline points="1103,278 1103,791" fill="none" stroke="#D6E3EB" stroke-width="2" stroke-dasharray="6 5"/><rect x="1316" y="213" width="204" height="62" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1316" y="213" width="204" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="1334" y="248" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Case storage</text><polyline points="1418,278 1418,791" fill="none" stroke="#D6E3EB" stroke-width="2" stroke-dasharray="6 5"/><polyline points="158,329 473,329" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="473,329 463.9955289764732,333.3496553411123 463.9955289764732,324.6503446588877" fill="#087BA8"/><text x="168" y="319" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#087BA8">1. Generate reviewed revision</text><polyline points="473,384 1418,384" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="1418,384 1408.9955289764732,388.3496553411123 1408.9955289764732,379.6503446588877" fill="#087BA8"/><text x="483" y="374" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#087BA8">2. Check owner, consent, state + reviewed revision; snapshot</text><polyline points="473,439 788,439" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="788,439 778.9955289764732,443.3496553411123 778.9955289764732,434.6503446588877" fill="#087BA8"/><text x="483" y="429" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#087BA8">3. Retrieve reviewed support</text><polyline points="788,492 473,492" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="473,492 482.0044710235268,487.6503446588877 482.0044710235268,496.3496553411123" fill="#087BA8"/><text x="483" y="482" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#087BA8">4. Return evidence bundle</text><polyline points="473,548 1103,548" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="1103,548 1093.9955289764732,552.3496553411123 1093.9955289764732,543.6503446588877" fill="#087BA8"/><text x="483" y="538" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#087BA8">5. generate_json(snapshot, schema)</text><polyline points="1103,603 473,603" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="473,603 482.0044710235268,598.6503446588877 482.0044710235268,607.3496553411123" fill="#087BA8"/><text x="483" y="593" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#087BA8">6. Typed candidate or error</text><rect x="368" y="635" width="238" height="49" rx="10" fill="#E8F5F3" stroke="#E8F5F3"/><text x="383" y="666" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">7. Validate output</text><polyline points="473,722 1418,722" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="1418,722 1408.9955289764732,726.3496553411123 1408.9955289764732,717.6503446588877" fill="#087BA8"/><text x="483" y="712" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#087BA8">8. Recheck owner, state, input/reviewed revisions + tombstone; publish atomically</text><polyline points="473,779 158,779" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="158,779 167.00447102352678,774.6503446588877 167.00447102352678,783.3496553411123" fill="#087BA8"/><text x="168" y="769" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#087BA8">9. Return current result</text><rect x="56" y="824" width="1488" height="100" rx="16" fill="#142F40" stroke="#142F40"/><text x="80" y="859" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#FFFFFF">Fail without publishing unsafe or stale output</text><text x="80" y="892.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#FFFFFF">1 schema repair allowed; total generation deadline 60 seconds. Failed validation gives a limited fallback. Edits invalidate pending output.</text></svg>