<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">PRODUCT DOCUMENTATION STANDARD</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">A reusable table of contents</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Start lean. Fill the sections needed for the next decision or delivery gate; do not write long documents for their own sake.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Recommended working standard v1.0 | HP + Solarity AI | 8 October 2026</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">03</text><rect x="56" y="219" width="480" height="315" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="78" y="255" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">D01 | SOLUTION BRIEF</text><text x="78" y="300" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Problem and target customer</text><text x="78" y="329" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Value proposition and differentiators</text><text x="78" y="358" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Key journey and conceptual architecture</text><text x="78" y="387" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Maturity and supported claims</text><text x="78" y="416" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Demo story and next action</text><rect x="560" y="219" width="480" height="315" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="582" y="255" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">D02 | PRODUCT MASTER</text><text x="582" y="300" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Vision, ICP and customer evidence</text><text x="582" y="329" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Goals, outcomes and business model</text><text x="582" y="358" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Scope, requirements and acceptance intent</text><text x="582" y="387" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Journeys, screens, states and design system</text><text x="582" y="416" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Pricing, entitlements and product metrics</text><text x="582" y="445" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Roadmap, assumptions and decisions</text><rect x="1064" y="219" width="480" height="315" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="1086" y="255" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">D03 | ENGINEERING</text><text x="1086" y="300" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">System context and deployment</text><text x="1086" y="329" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Modules, data model and contracts</text><text x="1086" y="358" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Sequences and state machines</text><text x="1086" y="387" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Identity, privacy and threat controls</text><text x="1086" y="416" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">AI/models, retrieval and evaluation hooks</text><text x="1086" y="445" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Observability, budgets and dependencies</text><rect x="56" y="558" width="480" height="315" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="78" y="594" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">D04 | VERIFICATION / RELEASE</text><text x="78" y="639" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Risk-based strategy and test matrix</text><text x="78" y="668" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Acceptance + contract + UI tests</text><text x="78" y="697" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">AI evaluations and failure scenarios</text><text x="78" y="726" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Privacy, accessibility and security checks</text><text x="78" y="755" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Release criteria and known limitations</text><text x="78" y="784" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Build-specific evidence and sign-off</text><rect x="560" y="558" width="480" height="315" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="582" y="594" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">D05 | OPERATIONS / GROWTH</text><text x="582" y="639" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Deploy, configure and roll back</text><text x="582" y="668" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Monitoring and incident response</text><text x="582" y="697" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Backup, recovery and data lifecycle</text><text x="582" y="726" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Support, ownership and escalation</text><text x="582" y="755" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Launch and distribution checklist</text><text x="582" y="784" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Experimentation, costs and feedback</text><rect x="1064" y="558" width="480" height="315" rx="16" fill="#142F40" stroke="#142F40"/><text x="1088" y="600" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#FFFFFF">DOCUMENT CONTROL</text><text x="1088" y="648" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#FFFFFF">Product ID</text><text x="1088" y="685" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#FFFFFF">Owner and approver</text><text x="1088" y="722" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#FFFFFF">Status and approved revision</text><text x="1088" y="759" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#FFFFFF">Last verified build</text><text x="1088" y="796" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#FFFFFF">Authoritative sources and change log</text></svg>