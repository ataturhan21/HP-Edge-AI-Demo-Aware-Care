<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">AWARE CARE</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Privacy is a lifecycle, not a location label</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Local processing must be accompanied by authorization, retention, controlled egress and verifiable deletion.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Source: PMD v2.0 pp. 29, 32 | Defaults belong to the planned local demo, not the browser mock</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">10</text><rect x="56" y="232" width="342" height="132" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="232" width="342" height="6" rx="3" fill="#008779" stroke="#008779"/><text x="74" y="267" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">1. Authorize</text><text x="74" y="295" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Consent + owner + role</text><rect x="430" y="232" width="342" height="132" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="430" y="232" width="342" height="6" rx="3" fill="#008779" stroke="#008779"/><text x="448" y="267" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">2. Store locally</text><text x="448" y="295" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Restricted DB and files</text><rect x="804" y="232" width="342" height="132" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="804" y="232" width="342" height="6" rx="3" fill="#008779" stroke="#008779"/><text x="822" y="267" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">3. Use by revision</text><text x="822" y="295" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">No stale guidance or exports</text><rect x="1178" y="232" width="342" height="132" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1178" y="232" width="342" height="6" rx="3" fill="#008779" stroke="#008779"/><text x="1196" y="267" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">4. Expire or delete</text><text x="1196" y="295" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Revoke, cancel and purge</text><polyline points="398,298 430,298" fill="none" stroke="#008779" stroke-width="2"/><polygon points="430,298 420.9955289764732,302.3496553411123 420.9955289764732,293.6503446588877" fill="#008779"/><polyline points="772,298 804,298" fill="none" stroke="#008779" stroke-width="2"/><polygon points="804,298 794.9955289764732,302.3496553411123 794.9955289764732,293.6503446588877" fill="#008779"/><polyline points="1146,298 1178,298" fill="none" stroke="#008779" stroke-width="2"/><polygon points="1178,298 1168.9955289764732,302.3496553411123 1168.9955289764732,293.6503446588877" fill="#008779"/><rect x="56" y="416" width="460" height="256" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="416" width="7" height="256" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="78" y="448" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">GUEST CONTENT</text><text x="78" y="485" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">30 minutes idle / 8 hours</text><text x="78" y="515" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">max</text><text x="78" y="557.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Expiry at whichever comes first. Reset</text><text x="78" y="585.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">purges health content. Planned browser</text><text x="78" y="613.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">memory is temporary, with no health</text><text x="78" y="641.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">data in localStorage.</text><rect x="540" y="416" width="490" height="256" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="540" y="416" width="7" height="256" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="562" y="448" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">SAVED + EXPORTED DATA</text><text x="562" y="485" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">30 days / 15 minutes</text><text x="562" y="527.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Saved synthetic cases default to 30 days,</text><text x="562" y="555.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">with 7-day option. Server export files expire</text><text x="562" y="583.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">after 15 minutes. Cleanup runs every 5</text><text x="562" y="611.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">minutes.</text><rect x="1054" y="416" width="490" height="256" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1054" y="416" width="7" height="256" rx="3" fill="#008779" stroke="#008779"/><text x="1076" y="448" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">DELETION COMPLETENESS</text><text x="1076" y="485" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">No late-job resurrection</text><text x="1076" y="527.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Block access, revoke downloads, cancel</text><text x="1076" y="555.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">jobs and purge dependent stores. Report</text><text x="1076" y="583.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">completion only after removal</text><text x="1076" y="611.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">acknowledgements.</text><rect x="56" y="729" width="1488" height="100" rx="16" fill="#142F40" stroke="#142F40"/><text x="80" y="764" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#FFFFFF">Boundary that must remain visible</text><text x="80" y="797.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#FFFFFF">A downloaded browser file is outside server deletion. No automatic clinician messaging, EHR write, or cloud-model fallback is included.</text></svg>