<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">PRODUCT DOCUMENTATION STANDARD</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Sources, interpretation and authority</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">The 5-document structure is a recommendation tailored to your workflow, not a mandated standard.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Recommended working standard v1.0 | HP + Solarity AI | 8 October 2026</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">08</text><text x="56" y="226" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#008779">Aware Care Product Master Document v2.0</text><text x="56" y="266" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Current Library version 1, read 8 October 2026. Atlas sources are listed on each page. It remains authoritative for Aware Care behavior and proposed</text><text x="56" y="294" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">implementation paths.</text><text x="56" y="390" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#008779">Current mock phase and chosen positioning</text><text x="56" y="430" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Conversation decisions: Aware Care name; mock-data prototype first; 1 local HP ZGX; future healthcare edge deployment. The atlas does not assert the</text><text x="56" y="458" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">target architecture is installed.</text><text x="56" y="554" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#008779">C4 model: containers and deployment</text><text x="56" y="594" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">https://c4model.com/diagrams/container</text><text x="56" y="622" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">https://c4model.com/diagrams/deployment</text><text x="56" y="650" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Used to distinguish software responsibilities from infrastructure placement; diagrams are adapted views, not a full C4 model.</text><text x="56" y="718" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#008779">NIST AI Risk Management Framework</text><text x="56" y="758" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">https://www.nist.gov/itl/ai-risk-management-framework</text><text x="56" y="786" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence</text><text x="56" y="814" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Supports lifecycle-oriented AI evaluation and risk management. No certification or conformance claim is made.</text></svg>