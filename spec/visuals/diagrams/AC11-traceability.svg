<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">AWARE CARE</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Trace behavior from specification to evidence</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Mappings are bidirectional and may be many-to-many. Shared code does not require duplicate product rules.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Source: PMD v2.0 pp. 18, 31, 42-43 | Paths and tests are planned, not verified implementations</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">11</text><rect x="56" y="235" width="280" height="133" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="235" width="280" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="74" y="270" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Requirement R30</text><text x="74" y="298" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Explained, repeatable</text><text x="74" y="321" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">provider ordering</text><rect x="392" y="235" width="314" height="133" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="392" y="235" width="314" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="410" y="270" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Screens A10 + A11</text><text x="410" y="298" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Doctor matches and details</text><rect x="762" y="235" width="334" height="133" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="762" y="235" width="334" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="780" y="270" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Owner M09</text><text x="780" y="298" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">ProviderSearchResult</text><text x="780" y="321" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">ProviderMatch</text><rect x="1152" y="235" width="392" height="133" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1152" y="235" width="392" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="1170" y="270" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Operations</text><text x="1170" y="298" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">searchProviders</text><text x="1170" y="321" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">getProvider</text><polyline points="336,301 392,301" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="392,301 382.9955289764732,305.3496553411123 382.9955289764732,296.6503446588877" fill="#087BA8"/><polyline points="706,301 762,301" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="762,301 752.9955289764732,305.3496553411123 752.9955289764732,296.6503446588877" fill="#087BA8"/><polyline points="1096,301 1152,301" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="1152,301 1142.9955289764732,305.3496553411123 1142.9955289764732,296.6503446588877" fill="#087BA8"/><rect x="56" y="427" width="716" height="203" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="427" width="7" height="203" rx="3" fill="#008779" stroke="#008779"/><text x="78" y="459" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">PROPOSED IMPLEMENTATION</text><text x="78" y="496" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Owning service + screen files</text><text x="78" y="538.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">apps/api/app/modules/providers/service.py</text><text x="78" y="563.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">apps/web/src/screens/A10.tsx</text><text x="78" y="588.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#526B7B">apps/web/src/screens/A11.tsx</text><rect x="796" y="427" width="748" height="203" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="796" y="427" width="7" height="203" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="818" y="459" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">PROPOSED VERIFICATION</text><text x="818" y="496" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Acceptance + UI tests</text><text x="818" y="538.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">tests/acceptance/test_R30.py</text><text x="818" y="564.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">tests/ui/A10.spec.ts; tests/ui/A11.spec.ts</text><text x="818" y="591.2" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Evidence identifies the tested commit and build.</text><rect x="56" y="689" width="1488" height="100" rx="16" fill="#142F40" stroke="#142F40"/><text x="80" y="724" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#FFFFFF">The release packet connects the proof</text><text x="80" y="757.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#FFFFFF">Spec and contract hashes + application commit + device/model/corpus manifests + executed tests + network and deletion evidence.</text><text x="56" y="843.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#142F40">CI checks IDs, paths, coverage and contract drift. Meaningful assertions and human review establish behavioral</text><text x="56" y="873.8" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#142F40">correctness.</text></svg>