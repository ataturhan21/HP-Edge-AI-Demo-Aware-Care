<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">PRODUCT DOCUMENTATION STANDARD</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">5 core documents per product</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Executive summary: keep 1 authoritative home for each fact, with linked contracts and generated views for each audience.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Recommended working standard v1.0 | HP + Solarity AI | 8 October 2026</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">01</text><rect x="56" y="217" width="1488" height="108" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="78" y="257" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#008779">D01</text><text x="163" y="257" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Solution Brief</text><text x="163" y="295" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#087BA8">Communicate value</text><text x="716" y="256.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Approved positioning, audience, problem, solution, differentiators, maturity</text><text x="716" y="284.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">and evidence-backed claims.</text><rect x="56" y="344" width="1488" height="108" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="78" y="384" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#008779">D02</text><text x="163" y="384" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Product Master Document</text><text x="163" y="422" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#087BA8">Define the product</text><text x="716" y="383.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Vision, ICP, business model, outcomes, scope, requirements, every</text><text x="716" y="411.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">screen/state, UX, pricing and roadmap.</text><rect x="56" y="471" width="1488" height="108" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="78" y="511" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#008779">D03</text><text x="163" y="511" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Engineering Specification</text><text x="163" y="549" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#087BA8">Define implementation</text><text x="716" y="510.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Architecture, contracts, data, state machines, AI behavior, security controls,</text><text x="716" y="538.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">deployment and performance budgets.</text><rect x="56" y="598" width="1488" height="108" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="78" y="638" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#008779">D04</text><text x="163" y="638" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Verification &amp; Release Plan</text><text x="163" y="676" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#087BA8">Prove readiness</text><text x="716" y="637.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Acceptance coverage, evaluations, test strategy, release gates, known</text><text x="716" y="665.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">limitations and linked evidence.</text><rect x="56" y="725" width="1488" height="108" rx="16" fill="#FFFFFF" stroke="#D6E3EB"/><text x="78" y="765" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#008779">D05</text><text x="163" y="765" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Operations &amp; Growth Playbook</text><text x="163" y="803" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#087BA8">Run and improve</text><text x="716" y="764.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Deployment, rollback, support, monitoring, incidents, recovery, launches,</text><text x="716" y="792.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">experiments and operating costs.</text><text x="56" y="893.0" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">5 logical documents, not a limit of 5 files. Chapters, API contracts, ADRs, issues and evidence are linked records.</text></svg>