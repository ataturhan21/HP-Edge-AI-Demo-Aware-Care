<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">AWARE CARE</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Separate patient facts from clinical evidence</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Both stay local during core processing. Confirmation establishes case facts; reviewed provenance supports clinical claims.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Source: PMD v2.0 pp. 19-20, 28-30 | Reviewed sources alone do not prove claim support</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">08</text><text x="56" y="232" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#008779">PATIENT RECORD LANE | M06</text><rect x="56" y="261" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="261" width="342" height="6" rx="3" fill="#008779" stroke="#008779"/><text x="74" y="296" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Validate file</text><text x="74" y="324" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Type, bytes, pages and limits</text><rect x="430" y="261" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="430" y="261" width="342" height="6" rx="3" fill="#008779" stroke="#008779"/><text x="448" y="296" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Extract locally</text><text x="448" y="324" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Bounded worker; no network</text><rect x="804" y="261" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="804" y="261" width="342" height="6" rx="3" fill="#008779" stroke="#008779"/><text x="822" y="296" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">User confirms facts</text><text x="822" y="324" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Confirm, correct or reject</text><rect x="1178" y="261" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1178" y="261" width="342" height="6" rx="3" fill="#008779" stroke="#008779"/><text x="1196" y="296" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Confirmed context</text><text x="1196" y="324" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Fact IDs + current revision</text><polyline points="398,330 430,330" fill="none" stroke="#008779" stroke-width="2"/><polygon points="430,330 420.9955289764732,334.3496553411123 420.9955289764732,325.6503446588877" fill="#008779"/><polyline points="772,330 804,330" fill="none" stroke="#008779" stroke-width="2"/><polygon points="804,330 794.9955289764732,334.3496553411123 794.9955289764732,325.6503446588877" fill="#008779"/><polyline points="1146,330 1178,330" fill="none" stroke="#008779" stroke-width="2"/><polygon points="1178,330 1168.9955289764732,334.3496553411123 1168.9955289764732,325.6503446588877" fill="#008779"/><text x="56" y="466" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#087BA8">CLINICAL EVIDENCE LANE | M07</text><rect x="56" y="495" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="495" width="342" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="74" y="530" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Approved sources</text><text x="74" y="558" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Presenter-controlled ingest</text><rect x="430" y="495" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="430" y="495" width="342" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="448" y="530" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Review + version</text><text x="448" y="558" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Publisher, date, hash, expiry</text><rect x="804" y="495" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="804" y="495" width="342" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="822" y="530" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Retrieve locally</text><text x="822" y="558" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Keyword + embedding search</text><rect x="1178" y="495" width="342" height="136" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1178" y="495" width="342" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="1196" y="530" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Validate support</text><text x="1196" y="558" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Source ID AND claim support</text><polyline points="398,564 430,564" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="430,564 420.9955289764732,568.3496553411123 420.9955289764732,559.6503446588877" fill="#087BA8"/><polyline points="772,564 804,564" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="804,564 794.9955289764732,568.3496553411123 794.9955289764732,559.6503446588877" fill="#087BA8"/><polyline points="1146,564 1178,564" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="1178,564 1168.9955289764732,568.3496553411123 1168.9955289764732,559.6503446588877" fill="#087BA8"/><rect x="56" y="688" width="716" height="167" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="688" width="7" height="167" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="78" y="720" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">RETRIEVAL BUDGET</text><text x="78" y="757" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Bounded evidence</text><text x="78" y="799.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Up to 8 candidates; retain up to 5 relevant passages within 6,000</text><text x="78" y="825.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">evidence tokens. Values require model-context testing.</text><rect x="796" y="688" width="748" height="167" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="796" y="688" width="7" height="167" rx="3" fill="#008779" stroke="#008779"/><text x="818" y="720" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">OUTPUT RULE</text><text x="818" y="757" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">No unsupported claims</text><text x="818" y="799.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Clinical claims cite approved evidence. Patient statements reference</text><text x="818" y="825.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">confirmed facts. Missing support produces a limited result.</text></svg>