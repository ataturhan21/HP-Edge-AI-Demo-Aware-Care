<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">PRODUCT DOCUMENTATION STANDARD</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Link intent, implementation and proof</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Precision comes from stable identities and automated checks. A forced 1:1 document-to-code mapping would misrepresent shared behavior.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Recommended working standard v1.0 | HP + Solarity AI | 8 October 2026</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">04</text><rect x="56" y="227" width="354" height="124" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="227" width="354" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="74" y="262" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Requirement</text><text x="74" y="290" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Normative source anchor</text><rect x="434" y="227" width="354" height="124" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="434" y="227" width="354" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="452" y="262" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Screen / state</text><text x="452" y="290" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">User-visible behavior</text><rect x="812" y="227" width="354" height="124" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="812" y="227" width="354" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="830" y="262" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Contract / module</text><text x="830" y="290" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Owned implementation rule</text><rect x="1190" y="227" width="354" height="124" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1190" y="227" width="354" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="1208" y="262" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Code / tests</text><text x="1208" y="290" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Exact paths and assertions</text><polyline points="410,289 434,289" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="434,289 424.9955289764732,293.3496553411123 424.9955289764732,284.6503446588877" fill="#087BA8"/><polyline points="788,289 812,289" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="812,289 802.9955289764732,293.3496553411123 802.9955289764732,284.6503446588877" fill="#087BA8"/><polyline points="1166,289 1190,289" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="1190,289 1180.9955289764732,293.3496553411123 1180.9955289764732,284.6503446588877" fill="#087BA8"/><rect x="56" y="401" width="716" height="237" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="401" width="7" height="237" rx="3" fill="#008779" stroke="#008779"/><text x="78" y="433" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">AWARE CARE EXAMPLE</text><text x="78" y="470" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">A05: Adaptive questions</text><text x="78" y="512.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">R11-R14 → M04 intake</text><text x="78" y="538.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">apps/web/src/screens/A05.tsx</text><text x="78" y="565.2" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">apps/api/app/modules/intake/service.py</text><text x="78" y="591.8" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">tests/ui/A05.spec.ts + R11-R14 acceptance tests</text><rect x="796" y="401" width="748" height="237" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="796" y="401" width="7" height="237" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="818" y="433" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">EVIDENCE IS BUILD-SPECIFIC</text><text x="818" y="470" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Planned ≠ implemented ≠ verified</text><text x="818" y="512.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">A trace record names source sections, surfaces, modules, code</text><text x="818" y="541.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">paths, test IDs and the tested build. A passing test from an old</text><text x="818" y="570.8" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">build does not verify new behavior.</text><rect x="56" y="699" width="1488" height="100" rx="16" fill="#142F40" stroke="#142F40"/><text x="80" y="734" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#FFFFFF">Automate structural consistency</text><text x="80" y="767.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#FFFFFF">CI can detect unknown IDs, orphan code, missing coverage and schema drift. It cannot prove that prose or behavior is semantically correct.</text><text x="56" y="853.0" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">Preserve existing IDs. Across products, add a namespace such as aware-care:A05 rather than renumbering the original</text><text x="56" y="882.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">screen.</text></svg>