<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">PRODUCT DOCUMENTATION STANDARD</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">The Product Master remains the front door</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Create a navigable master entry point. Compile a complete reading edition when needed; maintain each rule only once.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Recommended working standard v1.0 | HP + Solarity AI | 8 October 2026</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">02</text><rect x="56" y="219" width="716" height="251" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="219" width="7" height="251" rx="3" fill="#008779" stroke="#008779"/><text x="78" y="251" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">D02 | PRODUCT MASTER</text><text x="78" y="288" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Why, what and experience</text><text x="78" y="330.0" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">Own requirements, acceptance intent, complete journeys,</text><text x="78" y="360.8" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">screen states, product metrics, monetization and exclusions.</text><text x="78" y="391.6" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">Keep detailed UX as a section or appendix.</text><rect x="796" y="219" width="748" height="251" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="796" y="219" width="7" height="251" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="818" y="251" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">D03 | ENGINEERING</text><text x="818" y="288" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">How it is implemented</text><text x="818" y="330.0" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">Own architecture and executable contracts. Generate client</text><text x="818" y="360.8" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">types from one schema authority. Link to product rules instead</text><text x="818" y="391.6" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">of restating them.</text><rect x="56" y="516" width="1488" height="48" rx="7" fill="#FFFFFF" stroke="#FFFFFF"/><text x="77" y="548" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">Product behavior / pricing / entitlements</text><text x="864" y="548" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#008779">D02</text><rect x="56" y="571" width="1488" height="48" rx="7" fill="#E8F5F3" stroke="#E8F5F3"/><text x="77" y="603" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">Visual and interaction rules / all screens</text><text x="864" y="603" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#008779">D02; mockups are linked views</text><rect x="56" y="626" width="1488" height="48" rx="7" fill="#FFFFFF" stroke="#FFFFFF"/><text x="77" y="658" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">API / data / event payload definitions</text><text x="864" y="658" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#008779">D03 + canonical contract files</text><rect x="56" y="681" width="1488" height="48" rx="7" fill="#E8F5F3" stroke="#E8F5F3"/><text x="77" y="713" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">Quality thresholds / executed evidence</text><text x="864" y="713" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#008779">D04</text><rect x="56" y="736" width="1488" height="48" rx="7" fill="#FFFFFF" stroke="#FFFFFF"/><text x="77" y="768" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">Operational procedures / support ownership</text><text x="864" y="768" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#008779">D05</text><rect x="56" y="791" width="1488" height="48" rx="7" fill="#E8F5F3" stroke="#E8F5F3"/><text x="77" y="823" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">External claims / product positioning</text><text x="864" y="823" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#008779">D01, derived from D02 + D04</text><text x="56" y="896.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">KPI definition: D02. Instrumentation: D03. Validation: D04. Ongoing results and decisions: D05.</text></svg>