<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">AWARE CARE</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Demonstrate the workflow. Verify the deployment.</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Separate mock-data proof, local runtime proof and real-world outcome evidence.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Source: PMD v2.0 pp. 4-5, 34-36, 44 | No outcome or hardware performance claims implied</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">12</text><rect x="56" y="236" width="480" height="347" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="236" width="7" height="347" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="78" y="268" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">NOW</text><text x="78" y="305" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Mock-data experience</text><text x="78" y="347.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Synthetic patient journeys, scripted</text><text x="78" y="376.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">guidance, fictional providers and explicit</text><text x="78" y="405.8" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">failure states.</text><text x="78" y="435.2" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B"></text><text x="78" y="464.6" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Do not infer live AI, privacy controls or</text><text x="78" y="494.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">savings.</text><rect x="560" y="236" width="480" height="347" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="560" y="236" width="7" height="347" rx="3" fill="#008779" stroke="#008779"/><text x="582" y="268" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">NEXT</text><text x="582" y="305" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Connected local demo</text><text x="582" y="347.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Actual ZGX inventory, pinned runtime,</text><text x="582" y="376.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">reviewed corpus, internal stores and</text><text x="582" y="405.8" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">controlled retrieval.</text><text x="582" y="435.2" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B"></text><text x="582" y="464.6" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Measure performance and verify access,</text><text x="582" y="494.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">egress and reset.</text><rect x="1064" y="236" width="480" height="347" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1064" y="236" width="7" height="347" rx="3" fill="#BF5938" stroke="#BF5938"/><text x="1086" y="268" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#BF5938">LATER</text><text x="1086" y="305" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Healthcare edge pilot</text><text x="1086" y="347.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Deploy close to the care workflow with</text><text x="1086" y="376.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">approved intended use, evaluation and</text><text x="1086" y="405.8" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">operating ownership.</text><text x="1086" y="435.2" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B"></text><text x="1086" y="464.6" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Validate clinical outcomes, workload and</text><text x="1086" y="494.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">total cost.</text><text x="56" y="636" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#008779">5-MINUTE EXECUTIVE STORY</text><rect x="56" y="669" width="280" height="122" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><text x="74" y="707" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">0-1 min</text><text x="74" y="746.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Concern + data choices</text><rect x="358" y="669" width="280" height="122" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><text x="376" y="707" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">1-2 min</text><text x="376" y="746.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Record fact + intake</text><rect x="660" y="669" width="280" height="122" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><text x="678" y="707" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">2-3 min</text><text x="678" y="746.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Guidance + evidence</text><rect x="962" y="669" width="280" height="122" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><text x="980" y="707" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">3-4 min</text><text x="980" y="746.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Doctors + summary</text><rect x="1264" y="669" width="280" height="122" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><text x="1282" y="707" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">4-5 min</text><text x="1282" y="746.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Runtime + reset</text><text x="56" y="846.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Target gate: 10 full device rehearsals, including recovery. Targets of 5-second questions and 20-second guidance are acceptance goals,</text><text x="56" y="875.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">not established performance.</text></svg>