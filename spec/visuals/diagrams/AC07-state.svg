<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">AWARE CARE</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Case state is the authority</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Primary success path plus overriding guards. This plate summarizes transitions; the PMD state table remains normative.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Source: PMD v2.0 pp. 25-27, 30, 32 | Clinical edits never reuse an old result as current</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">07</text><rect x="56" y="232" width="260" height="112" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="232" width="260" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="74" y="267" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">draft</text><text x="74" y="295" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Concern + checks</text><rect x="430" y="232" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="430" y="232" width="300" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="448" y="267" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">intake</text><text x="448" y="295" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Up to 10 issued slots</text><rect x="870" y="232" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="870" y="232" width="300" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="888" y="267" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">review</text><text x="888" y="295" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Facts + gaps visible</text><rect x="870" y="433" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="870" y="433" width="300" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="888" y="468" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">reviewed</text><text x="888" y="496" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Current revision confirmed</text><rect x="430" y="433" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="430" y="433" width="300" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="448" y="468" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">generating</text><text x="448" y="496" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Bounded validated job</text><rect x="56" y="433" width="260" height="112" rx="14" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="433" width="260" height="6" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="74" y="468" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#142F40">guided</text><text x="74" y="496" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">Guidance + care</text><text x="74" y="519" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#526B7B">navigation</text><polyline points="316,288 430,288" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="430,288 420.9955289764732,292.3496553411123 420.9955289764732,283.6503446588877" fill="#087BA8"/><polyline points="730,288 870,288" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="870,288 860.9955289764732,292.3496553411123 860.9955289764732,283.6503446588877" fill="#087BA8"/><polyline points="1020,344 1020,433" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="1020,433 1015.6503446588877,423.9955289764732 1024.3496553411123,423.9955289764732" fill="#087BA8"/><polyline points="870,489 730,489" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="730,489 739.0044710235268,484.6503446588877 739.0044710235268,493.3496553411123" fill="#087BA8"/><polyline points="430,489 316,489" fill="none" stroke="#087BA8" stroke-width="2"/><polygon points="316,489 325.0044710235268,484.6503446588877 325.0044710235268,493.3496553411123" fill="#087BA8"/><polyline points="186,545 186,585 365,585 365,388 580,388 580,344" fill="none" stroke="#008779" stroke-width="2" stroke-dasharray="6 5"/><polygon points="580,344 584.3496553411123,353.0044710235268 575.6503446588877,353.0044710235268" fill="#008779"/><text x="240" y="614" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#008779">Clinical edit: return to intake; invalidate derived outputs</text><rect x="1240" y="232" width="304" height="315" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1240" y="232" width="7" height="315" rx="3" fill="#BF5938" stroke="#BF5938"/><text x="1262" y="264" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#BF5938">OVERRIDING GUARD</text><text x="1262" y="301" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Urgent concern</text><text x="1262" y="343.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Enter urgent. Block routine</text><text x="1262" y="369.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">intake, normal guidance</text><text x="1262" y="396.2" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">and doctor search. Restart</text><text x="1262" y="422.8" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">requires a new case.</text><rect x="56" y="662" width="460" height="204" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="662" width="7" height="204" rx="3" fill="#BF5938" stroke="#BF5938"/><text x="78" y="694" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#BF5938">LIMITED</text><text x="78" y="731" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Scope or service limits</text><text x="78" y="773.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Unknown critical facts, unsupported scope</text><text x="78" y="799.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">or required-service failure constrain the</text><text x="78" y="826.2" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">result. Retry only when recoverable.</text><rect x="540" y="662" width="490" height="204" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="540" y="662" width="7" height="204" rx="3" fill="#008779" stroke="#008779"/><text x="562" y="694" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">DELETION</text><text x="562" y="731" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">deleting → deleted</text><text x="562" y="773.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Block access immediately; cancel jobs and</text><text x="562" y="799.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">purge stores. Late workers check the</text><text x="562" y="826.2" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">tombstone. No return to active.</text><rect x="1054" y="662" width="490" height="204" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="1054" y="662" width="7" height="204" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="1076" y="694" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">QUESTION ACCOUNTING</text><text x="1076" y="731" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">The cap is on issued slots</text><text x="1076" y="773.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">Retry or edit an existing answer adds no slot.</text><text x="1076" y="799.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">An invalidated issued prompt still counts. No</text><text x="1076" y="826.2" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">11th question.</text></svg>