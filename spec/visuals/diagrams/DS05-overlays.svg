<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">PRODUCT DOCUMENTATION STANDARD</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Same structure. Different product overlays.</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Add applicable sections to the same 5 documents. A new platform or domain does not require a new document family.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Recommended working standard v1.0 | HP + Solarity AI | 8 October 2026</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">05</text><rect x="56" y="224" width="732" height="282" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="224" width="7" height="282" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="78" y="256" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">SOLARITY MOBILE</text><text x="78" y="293" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Subscriptions + mobile lifecycle</text><text x="78" y="335.0" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">Onboarding, paywalls and entitlements; purchase and restore</text><text x="78" y="365.8" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">flows; push permissions; offline behavior; account deletion;</text><text x="78" y="396.6" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">distribution and attribution.</text><rect x="812" y="224" width="732" height="282" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="812" y="224" width="7" height="282" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="834" y="256" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">WEB APPLICATIONS</text><text x="834" y="293" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Browser + navigation behavior</text><text x="834" y="335.0" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">Responsive breakpoints; route and direct-link guards; browser</text><text x="834" y="365.8" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">support; authentication; accessibility; SEO where relevant;</text><text x="834" y="396.6" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">deployment and rollback.</text><rect x="56" y="536" width="732" height="282" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="536" width="7" height="282" rx="3" fill="#008779" stroke="#008779"/><text x="78" y="568" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">HP LOCAL / EDGE AI</text><text x="78" y="605" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Device + execution boundaries</text><text x="78" y="647.0" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">Hardware/runtime compatibility; model provenance; memory</text><text x="78" y="677.8" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">and latency budgets; local/external data paths; offline and</text><text x="78" y="708.6" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">failure modes; measured benchmarks; demo reset.</text><rect x="812" y="536" width="732" height="282" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="812" y="536" width="7" height="282" rx="3" fill="#008779" stroke="#008779"/><text x="834" y="568" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">HEALTHCARE AI</text><text x="834" y="605" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Intended use + evidence</text><text x="834" y="647.0" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">Supported scope and exclusions; clinical content ownership;</text><text x="834" y="677.8" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">urgency escalation; uncertainty; source provenance;</text><text x="834" y="708.6" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#526B7B">provider-data limits; evaluation and review.</text><text x="56" y="902.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#526B7B">These are coverage categories. Consult current platform rules when preparing an actual release.</text></svg>