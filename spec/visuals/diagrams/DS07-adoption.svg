<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FB" stroke="#F5F8FB"/><text x="56" y="48" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#008779">PRODUCT DOCUMENTATION STANDARD</text><text x="56" y="102" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#142F40">Adopt without losing the master document</text><text x="56" y="142.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Proposed reorganization only. The existing Aware Care master remains unchanged until its sections are migrated and checked.</text><polyline points="56,190 1544,190" fill="none" stroke="#D6E3EB" stroke-width="1"/><text x="56" y="962" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#526B7B">Recommended working standard v1.0 | HP + Solarity AI | 8 October 2026</text><text x="1450" y="962" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#008779">07</text><rect x="56" y="223" width="716" height="285" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="56" y="223" width="7" height="285" rx="3" fill="#008779" stroke="#008779"/><text x="78" y="255" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#008779">EXISTING AWARE CARE BASELINE</text><text x="78" y="292" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Split authority, preserve identities</text><text x="78" y="334.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">Keep executive strategy, value, requirements and all screens</text><text x="78" y="363.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">in D02. Move implementation detail to D03. Put verification</text><text x="78" y="392.8" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">strategy and release evidence in D04. Put runbooks and</text><text x="78" y="422.2" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">improvement procedures in D05.</text><rect x="796" y="223" width="748" height="285" rx="18" fill="#FFFFFF" stroke="#D6E3EB"/><rect x="796" y="223" width="7" height="285" rx="3" fill="#087BA8" stroke="#087BA8"/><text x="818" y="255" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#087BA8">COMPLETE READING EDITION</text><text x="818" y="292" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#142F40">Generate the all-in-one view</text><text x="818" y="334.0" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">A compiled Product Master can include the executive summary,</text><text x="818" y="363.4" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">every screen, technical chapters and release links. Mark included</text><text x="818" y="392.8" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">chapters with their source revision so the reading copy never</text><text x="818" y="422.2" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#526B7B">becomes a competing authority.</text><text x="56" y="562" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#008779">RECOMMENDED REPOSITORY HOMES</text><rect x="56" y="593" width="1488" height="55" rx="8" fill="#FFFFFF" stroke="#FFFFFF"/><text x="76" y="629" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">docs/</text><text x="320" y="629" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">5 documents, index, controlled chapters and decision records</text><rect x="56" y="659" width="1488" height="55" rx="8" fill="#FFFFFF" stroke="#FFFFFF"/><text x="76" y="695" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">spec/</text><text x="320" y="695" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">Requirements, screen registry, contracts and traceability</text><rect x="56" y="725" width="1488" height="55" rx="8" fill="#FFFFFF" stroke="#FFFFFF"/><text x="76" y="761" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">tests/</text><text x="320" y="761" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">Executable acceptance, contract, UI and AI evaluation suites</text><rect x="56" y="791" width="1488" height="55" rx="8" fill="#FFFFFF" stroke="#FFFFFF"/><text x="76" y="827" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087BA8">evidence/</text><text x="320" y="827" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#142F40">Immutable results tied to commits, builds and releases</text><text x="56" y="898.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#526B7B">Suggested effort: a 1-page brief, lean master/specification, risk-based verification plan and minimum viable runbook. Expand with complexity.</text></svg>